name: E2E

# Browser E2E + API integration + axe a11y. Heavier than CI, so it runs on
# master and on demand rather than on every push.
#
# It also runs on any PR that changes the dependency manifest, and that exception was paid for.
# A Dependabot PR bumping @simplewebauthn from 11 to 13 arrived green: CI does lint, typecheck,
# unit tests and build, none of which touch a passkey. The only coverage of enrol-then-sign-in
# is here, and it never gated the PR — so the way to find out whether passkeys still worked was
# to build the artifact and run this suite by hand. That is not a thing to do per bump.
#
# `paths` and not every PR: this suite takes ~4 minutes, and a PR that only moves CSS around
# cannot break a dependency. No secrets are needed either (the job's env holds literals for the
# throwaway MySQL service), which matters because Dependabot PRs run without repository
# secrets — a job that needed them would fail for reasons unrelated to the bump.
#
# On the Deploy side this is harmless: `deploy.yml` looks up E2E runs by head SHA, and a PR head
# SHA is not master's. If a PR is ever merged as a fast-forward the two coincide, and the gate
# then finds two runs for one SHA and takes the newest — both ran the same code, so either
# answer is correct.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright (API + journeys + axe)
    runs-on: ubuntu-latest

    services:
      # MySQL 8.4 to match production — see the note in ci.yml.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: gourmerge_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/gourmerge_test
      NUXT_SESSION_PASSWORD: ci-test-session-password-32-chars-min
      NUXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium + deps)
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        run: npx drizzle-kit migrate

      - name: Build
        run: npm run build

      - name: Run E2E + API + a11y tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # NOT `playwright-report/`. That directory is the HTML reporter's output, and CI
          # uses the `github` reporter (see playwright.config.ts) — it annotates the Actions
          # log directly and never writes an HTML report, so this step ran on every failure
          # so far and silently uploaded nothing. Screenshots (`screenshot: only-on-failure`)
          # and traces (`trace: on-first-retry`) both land in `test-results/`, which is
          # Playwright's own default output directory regardless of which reporter is active.
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
