name: E2E

# Browser E2E + API integration + axe a11y. Heavier than CI, so it runs on
# master and on demand rather than every push.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright (API + journeys + axe)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testpassword
          MARIADB_DATABASE: gourmerge_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/gourmerge_test
      NUXT_SESSION_PASSWORD: ci-test-session-password-32-chars-min
      NUXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium + deps)
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        run: npx drizzle-kit migrate

      - name: Build
        run: npm run build

      - name: Run E2E + API + a11y tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
