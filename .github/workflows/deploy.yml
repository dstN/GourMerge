name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  # Manual escape hatch for hotfixes. The automatic path above is unchanged and
  # still requires a green CI and a green E2E; this only adds a second, deliberate
  # way in. `skip_e2e` is a named choice recorded in the run, not a default.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy (blank = newest master commit with a green CI)'
        required: false
        type: string
      skip_e2e:
        description: 'Hotfix: deploy without requiring the E2E suite'
        required: false
        default: false
        type: boolean
      # Content only (texts, legal pages; Dustin, 20 October 2026): build here instead of taking the CI artifact, so
      # no CI run is needed; implies skipping the E2E gate. Migrations, seeding, upload and swap run as always.
      ohne_ci:
        description: 'Content only: build in this job, without a CI run (implies skip_e2e)'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy to Netcup
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # The repository default for the workflow token is `read`, which grants
    # contents only. Two steps here read the Actions API and fail with a 403
    # without an explicit grant: the E2E gate calls listWorkflowRuns, and the
    # artifact download passes a `run-id`, so it reads a different run.
    permissions:
      contents: read
      actions: read
    # The environment must exist in repo Settings → Environments for its protection
    # rules to apply. If it does not, GitHub silently auto-creates an UNPROTECTED one
    # on first run — so an absent `production` environment means no approval gate.
    # Keep the DEPLOY_*/DATABASE_URL secrets as ENVIRONMENT secrets on this
    # environment, not repository secrets: repo secrets are readable by any workflow
    # on any branch, which would bypass the approval gate entirely.
    environment:
      name: production

    env:
      # Netcup's SSH is a chrooted /bin/bash whose root IS the subscription root,
      # so this path is what `pwd` shows over SSH (verified: /gourmerge.de), not a
      # /var/www/vhosts/... path.
      REMOTE_PATH: ${{ secrets.DEPLOY_PATH }}
      REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}

    steps:
      # Fail in seconds with a readable message instead of 15 minutes later at the
      # migrate step. Without DATABASE_URL, drizzle.config.ts falls back to its
      # localhost dev URL and the failure looks like a database problem rather than
      # unconfigured secrets.
      - name: Preflight — required secrets are configured
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=''
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PASSWORD DEPLOY_PATH DEPLOY_DOMAIN DATABASE_URL; do
            # Indirect expansion, so multi-line values stay intact.
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Deploy aborted — unset secrets:$missing"
            echo "Add them as ENVIRONMENT secrets under Settings → Environments → production."
            echo "See docs/SECRETS.md for what each one holds."
            exit 1
          fi
          echo "All required deploy secrets are present."

      # Both entry points have to end up with the same two facts: which commit to
      # deploy, and which CI run holds its build artifact. On `workflow_run` the
      # event carries both. On a manual run neither exists, so the newest
      # successful CI run for the requested commit (or for master) is looked up.
      - name: Resolve the commit and the CI run holding its artifact
        id: target
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_run') {
              core.setOutput('sha', context.payload.workflow_run.head_sha)
              core.setOutput('run_id', String(context.payload.workflow_run.id))
              return
            }

            const wanted = (process.env.REQUESTED_SHA || '').trim()
            // content only: the commit asked for, or the tip this run was started on; it is built below
            if (process.env.OHNE_CI === 'true') {
              const sha = wanted || context.sha
              core.info(`Content-only deploy of ${sha}, built in this job.`)
              core.setOutput('sha', sha)
              core.setOutput('run_id', '')
              return
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'master',
              status: 'success',
              per_page: 50,
            })

            const runs = [...data.workflow_runs].sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            )
            const run = wanted ? runs.find((r) => r.head_sha.startsWith(wanted)) : runs[0]

            if (!run) {
              core.setFailed(
                wanted
                  ? `No successful CI run found for ${wanted}. The artifact it would deploy does not exist.`
                  : 'No successful CI run found on master.'
              )
              return
            }

            core.info(`Deploying ${run.head_sha} from CI run ${run.id}.`)
            core.setOutput('sha', run.head_sha)
            core.setOutput('run_id', String(run.id))
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          OHNE_CI: ${{ inputs.ohne_ci }}

      # CI and E2E start together on a master push, and this job is triggered by
      # CI alone — so without this wait a green CI would deploy while E2E (the
      # only end-to-end coverage of fork → GourMerge Request → merge) is still
      # running. Deliberately early: nothing below it touches the production
      # database or the live release. actions/github-script is GitHub-owned and
      # never sees the SSH password.
      - name: Require the E2E suite to have passed for this commit
        # Skipped only on a manual run that explicitly asked for it. The automatic
        # path cannot reach this condition, so the normal gate stays mandatory.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.skip_e2e || inputs.ohne_ci)) }}
        timeout-minutes: 35
        uses: actions/github-script@v9
        with:
          script: |
            const sha = '${{ steps.target.outputs.sha }}'
            const deadlineMs = Date.now() + 30 * 60 * 1000
            const terminalFailures = ['failure', 'cancelled', 'timed_out', 'action_required', 'stale']

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'e2e.yml',
                head_sha: sha,
              })

              // Newest first, so a re-run supersedes an earlier attempt.
              const runs = [...data.workflow_runs].sort(
                (a, b) => new Date(b.created_at) - new Date(a.created_at)
              )
              const run = runs[0]

              if (run && run.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info(`E2E passed for ${sha} (run ${run.id}).`)
                  return
                }
                if (terminalFailures.includes(run.conclusion)) {
                  core.setFailed(
                    `E2E concluded "${run.conclusion}" for ${sha} (run ${run.id}) — refusing to deploy. ${run.html_url}`
                  )
                  return
                }
              }

              if (Date.now() > deadlineMs) {
                core.setFailed(
                  run
                    ? `Timed out waiting for E2E run ${run.id} (status "${run.status}") on ${sha}.`
                    : `No E2E workflow run found for ${sha} within the deadline. E2E runs on master pushes; ` +
                        `if CI was re-run without a push, dispatch E2E for this commit and re-run this deploy.`
                )
                return
              }

              core.info(
                run
                  ? `E2E run ${run.id} is "${run.status}" — waiting…`
                  : `No E2E run for ${sha} yet — waiting…`
              )
              await new Promise((resolve) => setTimeout(resolve, 30_000))
            }

      # Check out the exact commit CI built, not master's tip — otherwise a push
      # landing mid-deploy would migrate a schema the artifact doesn't match.
      - name: Checkout the built commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      # drizzle-kit lives in devDependencies and migrations are run from here
      # (the chrooted webspace has neither node, npx, nor the migration files).
      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.ohne_ci) }}
        uses: actions/download-artifact@v8
        with:
          name: gourmerge-output-${{ steps.target.outputs.sha }}
          path: .output/
          # artifact is uploaded by the CI workflow for the same commit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.target.outputs.run_id }}

      # Content only: the build of ci.yml, made here instead of downloaded. No Sentry token in this job (it holds
      # the SSH password), so the source-map upload is skipped; the release is still stamped.
      - name: Build (content only, no CI artifact)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ohne_ci }}
        env:
          NUXT_SENTRY_RELEASE: ${{ steps.target.outputs.sha }}
        run: npm run build

      # Migrations run BEFORE the new artifact goes live: our migrations are
      # additive, so the currently-running (old) code tolerates the new schema,
      # but the new code would break on the old one. A non-zero exit fails the
      # job here and the live release is left untouched.
      - name: Run database migrations against production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx drizzle-kit migrate

      # Reference data, not user data — and the app is unusable without it. Migrations
      # create empty tables, so a freshly migrated database has no ingredients: the
      # autocomplete returns nothing and nobody can author a recipe, which is the core
      # loop. That gap bit us once already, on the very first production database.
      #
      # Runs on every deploy because all of them are idempotent, verified by running them
      # twice against a populated database and diffing the row counts (no change:
      # "Imported 0 new + updated 1191 existing", "skipped 1", "skipped 12"). The
      # mechanisms are ON DUPLICATE KEY UPDATE keyed by (dataset, external_id), a
      # LOWER(name) existence check, and INSERT IGNORE respectively.
      #
      # A side effect worth knowing: seed:swiss re-UPDATES all 1191 Swiss rows whenever the
      # dataset version or row count differs, so the committed JSONL is the source of truth
      # for ingredient names and any hand-edit made directly in production is reverted on
      # the next deploy. That is the intended direction for BLV reference data.
      #
      # search:rebuild goes last: the autocomplete reads `ingredient_search_terms`, which is
      # derived from whatever the seeds above just wrote (and from user-created rows). It
      # is a full, idempotent rebuild — a few batched statements, seconds even against the
      # remote host — so a seed that predates the table or a changed normalisation rule is
      # healed here rather than needing its own migration.
      #
      # Placed before the artifact swap for the same reason as the migrations: if seeding
      # fails, the deploy stops and the previous release stays live.
      - name: Seed reference data (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run seed:swiss
          npm run db:seed
          npm run db:seed:tags
          npm run search:rebuild

      # Everything remote is done with plain ssh + sshpass rather than a
      # marketplace action: the webspace login is a password (Netcup exposes no
      # key auth in the panel) and it is shared across all 26 domains on this
      # subscription, so it must not be handed to a third-party action behind a
      # mutable tag like @v1.
      - name: Set up SSH (password auth + host key)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_HOSTKEY: ${{ secrets.DEPLOY_SSH_HOSTKEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          if [ -n "${DEPLOY_SSH_HOSTKEY:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_HOSTKEY" > ~/.ssh/known_hosts_deploy
            echo "Host key pinned from DEPLOY_SSH_HOSTKEY."
          else
            ssh-keyscan -t ed25519,rsa "$DEPLOY_HOST" > ~/.ssh/known_hosts_deploy 2>/dev/null
            echo "::warning::DEPLOY_SSH_HOSTKEY is not set, so the deploy trusts whatever"
            echo "::warning::key ssh-keyscan just fetched. With password auth an attacker in"
            echo "::warning::the path would receive the account password in cleartext. Pin it:"
            echo "::warning::  ssh-keyscan -t ed25519 ${DEPLOY_HOST}"
            echo "::warning::and store the output line as the DEPLOY_SSH_HOSTKEY secret."
          fi
          chmod 600 ~/.ssh/known_hosts_deploy

      # rsync is NOT available in the chroot (verified: only tar, sh, mv, touch,
      # mkdir), so the artifact is streamed as a gzipped tar over ssh. Staged into
      # .output.new so the live .output is never a half-written tree.
      - name: Upload release to staging directory
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          # Deliberately unquoted below: these are separate ssh arguments.
          # Compression=yes compresses in the SSH transport, so the remote side
          # needs no gzip. `tar -z` would shell out to gzip, which is NOT among the
          # binaries the chroot provides (only tar, sh, mv, touch, mkdir are
          # confirmed) — an uncompressed tar stream keeps the remote dependency
          # surface to tar alone.
          SSH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts_deploy -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o Compression=yes"

          # `sshpass -e` takes the password from $SSHPASS; `-p` would expose it in
          # the process list.
          sshpass -e ssh $SSH_OPTS "$REMOTE" sh -s "$REMOTE_PATH" <<'REMOTE'
          set -eu
          rm -rf "$1/.output.new"
          mkdir -p "$1/.output.new"
          REMOTE

          # pipefail matters here: without it a failing tar would be masked by a
          # successful ssh and we would activate an incomplete release.
          tar cf - -C .output . \
            | sshpass -e ssh $SSH_OPTS "$REMOTE" "tar xf - -C '$REMOTE_PATH/.output.new'"

          # Passenger's startup file. Tiny, so just stream it in place.
          sshpass -e ssh $SSH_OPTS "$REMOTE" "cat > '$REMOTE_PATH/app.js'" < app.js

          echo "Artifact staged in $REMOTE_PATH/.output.new"

      # Directory renames are near-instant, so the window where .output is absent
      # is far smaller than a full upload. The outgoing release is kept as
      # .output.prev — that is what the rollback repoints to.
      - name: Activate release and restart Passenger
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts_deploy -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no"

          sshpass -e ssh $SSH_OPTS "$REMOTE" sh -s "$REMOTE_PATH" <<'REMOTE'
          set -eu
          cd "$1"

          test -d .output.new || { echo "staged release missing"; exit 1; }
          test -f .output.new/server/index.mjs || { echo "staged release looks incomplete"; exit 1; }

          rm -rf .output.prev
          if [ -d .output ]; then
            mv .output .output.prev
          fi
          mv .output.new .output

          mkdir -p tmp
          touch tmp/restart.txt

          echo "Release activated (previous kept in .output.prev)."
          REMOTE

      - name: Smoke test
        id: smoke
        run: |
          # Four minutes, not one. The first version allowed 6 × 10s and that was measured to
          # be too short: it rejected a release that was merely still starting, the rollback
          # duly swapped a WORKING build out for an older one, and the site then came up on
          # its own a few minutes later. A too-eager health check does not just misreport —
          # here it caused the outage it was meant to catch.
          #
          # Passenger spawns on the first request, and a cold start of a 26MB artifact on
          # shared hosting means Nitro, Sentry and auth-utils initialising before anything
          # answers. During that window Apache serves the document root, so the check sees
          # 403/404 from a host that is in fact fine. There is no signal that distinguishes
          # "still spawning" from "will never start" — only elapsed time — so the budget has
          # to be generous enough that expiry really does mean broken.
          for i in $(seq 1 16); do
            sleep 15
            STATUS=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://${{ secrets.DEPLOY_DOMAIN }}/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS) after $((i * 15))s"
              exit 0
            fi
            echo "Attempt $i/16 ($((i * 15))s): health check returned $STATUS"
          done

          # Six identical numbers and nothing else is not enough to act on. The status code
          # says WHO answered, and that is the difference between a broken release and a
          # misconfigured host:
          #
          #   404/403  Apache answered, Passenger never saw the request. The app root has no
          #            startup file — i.e. DEPLOY_PATH is not the Plesk "Application Root",
          #            or Node.js is off for the domain. Nothing in the artifact can fix that.
          #   500/502  Passenger tried and the app failed to boot. That IS the release: check
          #            missing env vars first, then .output.failed on the host.
          #   000      DNS/TLS/network — the deploy never reached the site.
          ROOT=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.DEPLOY_DOMAIN }}/" || true)
          echo "Health check never returned 200 in 4 minutes. Last: /api/health → $STATUS, / → $ROOT"
          case "$STATUS" in
            404 | 403)
              echo "::error::Apache answered, not the app: Passenger is not handling requests."
              echo "::error::Check that DEPLOY_PATH equals Plesk's Node.js *Application Root*"
              echo "::error::(it is the directory Passenger looks for app.js in — often httpdocs,"
              echo "::error::not the domain root) and that the startup file is set to app.js."
              ;;
            500 | 502 | 503)
              echo "::error::Passenger booted the app and it failed. Check the runtime env vars"
              echo "::error::first — /api/health 503s by design when config is missing."
              ;;
            000) echo "::error::No HTTP response at all — DNS, TLS or firewall." ;;
          esac
          exit 1

      # Paths that must never be readable over HTTP. `backups/` and `.my.cnf` sit outside the
      # document root by design, and `.output/` is the server bundle — but "by design" is a
      # claim about a Plesk setting nobody re-checks. If DEPLOY_PATH and the Node.js
      # Application Root ever drift so that the artifact lands inside httpdocs, every server
      # chunk becomes downloadable and the only symptom is that the site still works.
      #
      # Checked from outside, after the release is live, because that is the only place the
      # answer is real. A 404 or 403 passes. So does the app answering with its own page — the
      # `/[username]` route is wide enough to catch most of these — so the test is on CONTENT,
      # not on the status code: a database dump, a credentials file and a shell script all have
      # recognisable first bytes.
      - name: Verify nothing sensitive is web-readable
        if: steps.smoke.outcome == 'success'
        run: |
          set -uo pipefail
          fail=0
          for path in /backups/ /backups /.my.cnf /server-backup.sh /.env /.output/server/index.mjs /package.json; do
            body=$(curl -s -m 20 "https://${{ secrets.DEPLOY_DOMAIN }}$path" || true)
            code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "https://${{ secrets.DEPLOY_DOMAIN }}$path" || true)
            # Markers of the real files, not of the app's HTML.
            if printf '%s' "$body" | grep -qE '^\[client\]|^#!/bin/(sh|bash)|mysqldump|^-- MySQL|^INSERT INTO|DATABASE_URL=|NUXT_SESSION_PASSWORD=|"dependencies"[[:space:]]*:'; then
              echo "::error::$path ($code) served real file content — it is web-readable."
              fail=1
            else
              echo "ok   $path → $code, no file content"
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # The retained artifact only earns its keep if a bad release is actually
      # reverted. Runs only when the smoke test failed.
      - name: Roll back to previous release
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts_deploy -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no"

          sshpass -e ssh $SSH_OPTS "$REMOTE" sh -s "$REMOTE_PATH" <<'REMOTE'
          set -eu
          cd "$1"

          if [ ! -d .output.prev ]; then
            echo "No .output.prev to roll back to (first deploy?) — leaving as-is."
            exit 1
          fi

          rm -rf .output.failed
          mv .output .output.failed
          mv .output.prev .output

          mkdir -p tmp
          touch tmp/restart.txt

          echo "Rolled back to the previous release (bad build kept in .output.failed)."
          REMOTE

          # A rollback that is never checked is a guess. `.output.prev` only means "what was
          # there before", not "what worked" — on the first deploys it can be a partial or
          # hand-assembled tree, so restoring it can leave the site MORE broken than the
          # release that just failed. Say which of the two happened, in the log, at the time.
          sleep 15
          BACK=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.DEPLOY_DOMAIN }}/api/health" || true)
          if [ "$BACK" = "200" ]; then
            echo "Rollback verified: the site is serving again (HTTP $BACK)."
          else
            echo "::error::Rollback did NOT restore a working site (/api/health → $BACK)."
            echo "::error::The site is down. .output.failed holds the release that was just"
            echo "::error::rejected and .output the one restored — neither answers. Fix on the"
            echo "::error::host; do not re-run this workflow expecting it to recover."
          fi
