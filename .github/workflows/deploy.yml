name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

jobs:
  deploy:
    name: Deploy to Netcup
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # The environment must exist in repo Settings → Environments for its protection
    # rules to apply. If it does not, GitHub silently auto-creates an UNPROTECTED one
    # on first run — so an absent `production` environment means no approval gate.
    # Keep the DEPLOY_*/DATABASE_URL secrets as ENVIRONMENT secrets on this
    # environment, not repository secrets: repo secrets are readable by any workflow
    # on any branch, which would bypass the approval gate entirely.
    environment:
      name: production

    env:
      # Netcup's SSH is a chrooted /bin/bash whose root IS the subscription root,
      # so this path is what `pwd` shows over SSH (verified: /gourmerge.de), not a
      # /var/www/vhosts/... path.
      REMOTE_PATH: ${{ secrets.DEPLOY_PATH }}
      REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}

    steps:
      # Fail in seconds with a readable message instead of 15 minutes later at the
      # migrate step. Without DATABASE_URL, drizzle.config.ts falls back to its
      # localhost dev URL and the failure looks like a database problem rather than
      # unconfigured secrets.
      - name: Preflight — required secrets are configured
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=''
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PASSWORD DEPLOY_PATH DEPLOY_DOMAIN DATABASE_URL; do
            # Indirect expansion, so multi-line values stay intact.
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Deploy aborted — unset secrets:$missing"
            echo "Add them as ENVIRONMENT secrets under Settings → Environments → production."
            echo "See docs/SECRETS.md for what each one holds."
            exit 1
          fi
          echo "All required deploy secrets are present."

      # CI and E2E start together on a master push, and this job is triggered by
      # CI alone — so without this wait a green CI would deploy while E2E (the
      # only end-to-end coverage of fork → GourMerge Request → merge) is still
      # running. Deliberately early: nothing below it touches the production
      # database or the live release. actions/github-script is GitHub-owned and
      # never sees the SSH password.
      - name: Require the E2E suite to have passed for this commit
        timeout-minutes: 35
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha
            const deadlineMs = Date.now() + 30 * 60 * 1000
            const terminalFailures = ['failure', 'cancelled', 'timed_out', 'action_required', 'stale']

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'e2e.yml',
                head_sha: sha,
              })

              // Newest first, so a re-run supersedes an earlier attempt.
              const runs = [...data.workflow_runs].sort(
                (a, b) => new Date(b.created_at) - new Date(a.created_at)
              )
              const run = runs[0]

              if (run && run.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info(`E2E passed for ${sha} (run ${run.id}).`)
                  return
                }
                if (terminalFailures.includes(run.conclusion)) {
                  core.setFailed(
                    `E2E concluded "${run.conclusion}" for ${sha} (run ${run.id}) — refusing to deploy. ${run.html_url}`
                  )
                  return
                }
              }

              if (Date.now() > deadlineMs) {
                core.setFailed(
                  run
                    ? `Timed out waiting for E2E run ${run.id} (status "${run.status}") on ${sha}.`
                    : `No E2E workflow run found for ${sha} within the deadline. E2E runs on master pushes; ` +
                        `if CI was re-run without a push, dispatch E2E for this commit and re-run this deploy.`
                )
                return
              }

              core.info(
                run
                  ? `E2E run ${run.id} is "${run.status}" — waiting…`
                  : `No E2E run for ${sha} yet — waiting…`
              )
              await new Promise((resolve) => setTimeout(resolve, 30_000))
            }

      # Check out the exact commit CI built, not master's tip — otherwise a push
      # landing mid-deploy would migrate a schema the artifact doesn't match.
      - name: Checkout the built commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      # drizzle-kit lives in devDependencies and migrations are run from here
      # (the chrooted webspace has neither node, npx, nor the migration files).
      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gourmerge-output-${{ github.event.workflow_run.head_sha }}
          path: .output/
          # artifact is uploaded by the CI workflow for the same commit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # Migrations run BEFORE the new artifact goes live: our migrations are
      # additive, so the currently-running (old) code tolerates the new schema,
      # but the new code would break on the old one. A non-zero exit fails the
      # job here and the live release is left untouched.
      - name: Run database migrations against production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx drizzle-kit migrate

      # Reference data, not user data — and the app is unusable without it. Migrations
      # create empty tables, so a freshly migrated database has no ingredients: the
      # autocomplete returns nothing and nobody can author a recipe, which is the core
      # loop. That gap bit us once already, on the very first production database.
      #
      # Runs on every deploy because all three are idempotent, verified by running them
      # twice against a populated database and diffing the row counts (no change:
      # "Imported 0 new + updated 1191 existing", "skipped 1", "skipped 12"). The
      # mechanisms are ON DUPLICATE KEY UPDATE, a LOWER(name) existence check, and
      # INSERT IGNORE respectively.
      #
      # A side effect worth knowing: seed:swiss re-UPDATES all 1191 Swiss rows each time,
      # so the committed JSONL is the source of truth for ingredient names and any
      # hand-edit made directly in production is reverted on the next deploy. That is the
      # intended direction for BLV reference data.
      #
      # Placed before the artifact swap for the same reason as the migrations: if seeding
      # fails, the deploy stops and the previous release stays live.
      - name: Seed reference data (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run seed:swiss
          npm run db:seed
          npm run db:seed:tags

      # Everything remote is done with plain ssh + sshpass rather than a
      # marketplace action: the webspace login is a password (Netcup exposes no
      # key auth in the panel) and it is shared across all 26 domains on this
      # subscription, so it must not be handed to a third-party action behind a
      # mutable tag like @v1.
      - name: Set up SSH (password auth + host key)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_HOSTKEY: ${{ secrets.DEPLOY_SSH_HOSTKEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          if [ -n "${DEPLOY_SSH_HOSTKEY:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_HOSTKEY" > ~/.ssh/known_hosts_deploy
            echo "Host key pinned from DEPLOY_SSH_HOSTKEY."
          else
            ssh-keyscan -t ed25519,rsa "$DEPLOY_HOST" > ~/.ssh/known_hosts_deploy 2>/dev/null
            echo "::warning::DEPLOY_SSH_HOSTKEY is not set, so the deploy trusts whatever"
            echo "::warning::key ssh-keyscan just fetched. With password auth an attacker in"
            echo "::warning::the path would receive the account password in cleartext. Pin it:"
            echo "::warning::  ssh-keyscan -t ed25519 ${DEPLOY_HOST}"
            echo "::warning::and store the output line as the DEPLOY_SSH_HOSTKEY secret."
          fi
          chmod 600 ~/.ssh/known_hosts_deploy

      # rsync is NOT available in the chroot (verified: only tar, sh, mv, touch,
      # mkdir), so the artifact is streamed as a gzipped tar over ssh. Staged into
      # .output.new so the live .output is never a half-written tree.
      - name: Upload release to staging directory
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          # Deliberately unquoted below: these are separate ssh arguments.
          # Compression=yes compresses in the SSH transport, so the remote side
          # needs no gzip. `tar -z` would shell out to gzip, which is NOT among the
          # binaries the chroot provides (only tar, sh, mv, touch, mkdir are
          # confirmed) — an uncompressed tar stream keeps the remote dependency
          # surface to tar alone.
          SSH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts_deploy -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o Compression=yes"

          # `sshpass -e` takes the password from $SSHPASS; `-p` would expose it in
          # the process list.
          sshpass -e ssh $SSH_OPTS "$REMOTE" sh -s "$REMOTE_PATH" <<'REMOTE'
          set -eu
          rm -rf "$1/.output.new"
          mkdir -p "$1/.output.new"
          REMOTE

          # pipefail matters here: without it a failing tar would be masked by a
          # successful ssh and we would activate an incomplete release.
          tar cf - -C .output . \
            | sshpass -e ssh $SSH_OPTS "$REMOTE" "tar xf - -C '$REMOTE_PATH/.output.new'"

          # Passenger's startup file. Tiny, so just stream it in place.
          sshpass -e ssh $SSH_OPTS "$REMOTE" "cat > '$REMOTE_PATH/app.js'" < app.js

          echo "Artifact staged in $REMOTE_PATH/.output.new"

      # Directory renames are near-instant, so the window where .output is absent
      # is far smaller than a full upload. The outgoing release is kept as
      # .output.prev — that is what the rollback repoints to.
      - name: Activate release and restart Passenger
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts_deploy -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no"

          sshpass -e ssh $SSH_OPTS "$REMOTE" sh -s "$REMOTE_PATH" <<'REMOTE'
          set -eu
          cd "$1"

          test -d .output.new || { echo "staged release missing"; exit 1; }
          test -f .output.new/server/index.mjs || { echo "staged release looks incomplete"; exit 1; }

          rm -rf .output.prev
          if [ -d .output ]; then
            mv .output .output.prev
          fi
          mv .output.new .output

          mkdir -p tmp
          touch tmp/restart.txt

          echo "Release activated (previous kept in .output.prev)."
          REMOTE

      - name: Smoke test
        id: smoke
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10  # give Passenger time to boot the new release
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.DEPLOY_DOMAIN }}/api/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: health check returned $STATUS"
          done
          echo "Health check never returned 200 — failing the deploy."
          exit 1

      # The retained artifact only earns its keep if a bad release is actually
      # reverted. Runs only when the smoke test failed.
      - name: Roll back to previous release
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o UserKnownHostsFile=$HOME/.ssh/known_hosts_deploy -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no"

          sshpass -e ssh $SSH_OPTS "$REMOTE" sh -s "$REMOTE_PATH" <<'REMOTE'
          set -eu
          cd "$1"

          if [ ! -d .output.prev ]; then
            echo "No .output.prev to roll back to (first deploy?) — leaving as-is."
            exit 1
          fi

          rm -rf .output.failed
          mv .output .output.failed
          mv .output.prev .output

          mkdir -p tmp
          touch tmp/restart.txt

          echo "Rolled back to the previous release (bad build kept in .output.failed)."
          REMOTE
