name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Lint → Design → Typecheck → i18n → Test → Build
    runs-on: ubuntu-latest

    services:
      # MySQL 8.4 to match production (which reports 8.4.11).
      # This was mariadb:11 while prod and local dev were both MySQL — and the
      # ingredient search runs raw JSON_EXTRACT/JSON_UNQUOTE plus a
      # collation-sensitive LIKE, and explore uses MATCH…AGAINST, all of which
      # differ between the engines. Tests must run on what production runs.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: gourmerge_test
        ports:
          - 3306:3306
        # -h 127.0.0.1 forces TCP, so the check cannot pass against the
        # init-phase unix socket before the network listener is up. MySQL's
        # first-boot init is slower than MariaDB's, hence the extra retries.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/gourmerge_test
      NUXT_SESSION_PASSWORD: ci-test-session-password-32-chars-min

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Enforces DESIGNBOOK.md. The axe gate checks contrast and the i18n gate
      # checks parity; neither catches design *inconsistency* — competing colour
      # spellings, ad-hoc button sizes, per-page content widths. This does.
      - name: Design-system gate
        run: npm run design:check

      - name: Format check
        run: npm run format:check

      - name: Dead-code check (knip)
        run: npm run knip

      - name: Typecheck
        run: npm run typecheck

      - name: i18n bilingual gate
        run: node scripts/i18n-check.mjs

      # Fail on any CRITICAL advisory. High/moderate are tracked + proposed as
      # reviewable PRs by Dependabot (some current highs are dev-tool/transitive
      # or need breaking upgrades — see docs/SECRETS.md / dependabot.yml).
      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

      - name: Run database migrations
        run: npx drizzle-kit migrate

      - name: Unit & component tests (with coverage gate)
        run: npm test -- --coverage

      # NUXT_SENTRY_RELEASE is read in nuxt.config at BUILD time (its name does
      # not match the runtimeConfig path, so it cannot be injected on the host).
      # Stamping the SHA here is what makes Sentry issues attributable to a
      # release. The SENTRY_* secrets are optional — source-map upload is skipped
      # when the auth token is empty, and the build still succeeds.
      - name: Build
        env:
          NUXT_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      # This artifact IS the release — deploy.yml downloads it and ships it to the
      # host, so anything missing here is missing in production.
      - name: Upload build artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: gourmerge-output-${{ github.sha }}
          path: .output/
          retention-days: 7
          # Not optional, and not related to the version bump above. Since
          # upload-artifact v4.4 hidden files are EXCLUDED by default, and Nitro puts
          # deduplicated runtime dependencies in `.output/server/node_modules/.nitro/`
          # — a dot directory. Locally that holds `entities@7.0.1` and `entities@8.0.0`
          # (28 files), with `node_modules/entities` symlinked into it. Dropping it means
          # the artifact is missing a package the server requires at runtime, and the
          # first deploy would have failed with a module-not-found nobody could explain
          # from the build log, because the build was green.
          include-hidden-files: true
